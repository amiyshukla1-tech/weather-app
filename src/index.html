<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="A responsive and modern weather forecast web application displaying real-time weather, 24-hour history, and future forecasts.">
    <title>Weather Web App</title>
    <link href="./output.css" rel="stylesheet">
    <script src="./script.js" defer></script>
</head>

<body
    class="relative min-h-screen bg-cover bg-center bg-fixed bg-no-repeat flex flex-col justify-start p-4 sm:p-6 lg:p-10 text-white antialiased selection:bg-emerald-400 selection:text-slate-900"
    style="background-image: url('./paul-green-tvk4EKq9m_w-unsplash.jpg');">

    <!-- Top Left Corner Logo -->
    <div class="absolute top-4 left-4 sm:top-6 sm:left-8 z-50">
        <div
            class="flex items-center gap-2.5 px-3 py-1.5 sm:px-4 sm:py-2 rounded-2xl bg-emerald-950/75 backdrop-blur-xl border border-emerald-500/30 shadow-xl shadow-black/50 hover:border-emerald-400/50 hover:scale-105 transition-all duration-300 cursor-pointer group">
            <div class="p-1.5 rounded-xl bg-gradient-to-tr from-emerald-400 to-cyan-400 text-slate-950 shadow-md">
                <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" stroke-width="2.2"
                    viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 00-9.78 2.096A4.001 4.001 0 003 15z" />
                </svg>
            </div>
            <span
                class="font-extrabold text-sm sm:text-base tracking-tight text-white group-hover:text-emerald-300 transition-colors drop-shadow">
                Weather<span class="text-emerald-400">App</span>
            </span>
        </div>
    </div>

    <div class="w-full max-w-4xl mx-auto flex flex-col gap-6 sm:gap-8 my-auto pt-14 sm:pt-4">

        <!-- 1. Header -->
        <header class="text-center py-4">
            <h1
                class="text-3xl sm:text-4xl md:text-5xl font-extrabold tracking-tight text-white drop-shadow-[0_3px_12px_rgba(0,0,0,0.8)]">
                Weather Dashboard
            </h1>
            <p class="text-sm sm:text-base text-emerald-100/90 mt-2 drop-shadow font-medium tracking-wide">
                Live forecast and 24-hour weather insights
            </p>
        </header>

        <!-- 2. Interactive Search Area -->
        <section aria-label="Search Location" class="w-full max-w-lg mx-auto">
            <form
                class="flex flex-col sm:flex-row gap-2.5 items-stretch shadow-lg shadow-black/60 rounded-2xl p-2 bg-emerald-950/65"
                onsubmit="return false;">
                <div class="flex items-center flex-1 px-3 gap-2.5">
                    <!-- Search Icon SVG -->
                    <svg class="w-5 h-5 text-emerald-300/75 shrink-0 focus:outline-none" fill="none"
                        stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-4.35-4.35M16.65 11a5.65 5.65 0 11-11.3 0 5.65 5.65 0 0111.3 0z"></path>
                    </svg>
                    <input type="text" id="location-input" placeholder="Search city or location..."
                        class="bg-transparent w-full text-white placeholder:text-emerald-100/50 focus:outline-none text-sm sm:text-base py-2 font-medium" />
                </div>
                <button type="button" id="search-btn"
                    class="btn sm:px-6 bg-blue-600 hover:bg-blue-700 text-white border-none rounded-xl font-bold shadow-lg shadow-blue-600/30 transition-all duration-400 cursor-pointer">
                    Search
                </button>
            </form>
        </section>

        <!-- 3. Current Weather Section -->
        <section aria-label="Current Weather"
            class="card bg-emerald-950/65 backdrop-blur-xl border border-emerald-500/25 text-white shadow-2xl shadow-black/60 rounded-3xl overflow-hidden p-6 sm:p-8 transition-all duration-300 hover:border-emerald-400/40 hover:shadow-emerald-950/40">
            <div
                class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-6 border-b border-emerald-500/20">
                <div>
                    <h2 id="location" class="text-2xl sm:text-3xl font-bold tracking-tight drop-shadow-sm"></h2>
                    <span
                        class="text-xs uppercase tracking-widest text-emerald-200/70 font-semibold mt-1 block">Condition</span>
                    <p id="condition" class="text-base sm:text-lg font-medium text-white/95"></p>
                </div>
            </div>

            <!-- Temperature Highlight -->
            <div class="py-6 sm:py-8">
                <span
                    class="text-xs uppercase tracking-widest text-emerald-200/70 font-semibold block">Temperature</span>
                <p id="temperature"
                    class="text-6xl sm:text-7xl font-black tracking-tight text-white mt-1 drop-shadow-md"></p>
            </div>

            <!-- Meteorological Details Grid with Visual Icons -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-6 border-t border-emerald-500/20">
                <!-- Wind Stat Card -->
                <div
                    class="bg-emerald-900/40 backdrop-blur-md rounded-2xl p-4 border border-emerald-500/20 flex items-center justify-between transition-all duration-200 hover:bg-emerald-900/60 hover:border-emerald-400/30">
                    <div>
                        <span
                            class="text-xs uppercase tracking-wider text-emerald-200/80 font-semibold block">Wind</span>
                        <p id="wind" class="text-xl sm:text-2xl font-bold mt-1 text-white"></p>
                    </div>
                    <!-- Wind Icon SVG (White) -->
                    <div class="p-2.5 rounded-xl bg-white/10 text-white border border-white/20 shadow-inner">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                            xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9.59 4.59A2 2 0 1111 8H2m10.59 11.41A2 2 0 1014 16H2m15.73-8.27A2.5 2.5 0 1119.5 12H2">
                            </path>
                        </svg>
                    </div>
                </div>

                <!-- Rain Probability Stat Card -->
                <div
                    class="bg-emerald-900/40 backdrop-blur-md rounded-2xl p-4 border border-emerald-500/20 flex items-center justify-between transition-all duration-200 hover:bg-emerald-900/60 hover:border-emerald-400/30">
                    <div>
                        <span class="text-xs uppercase tracking-wider text-emerald-200/80 font-semibold block">Rain
                            Probability</span>
                        <p id="rain" class="text-xl sm:text-2xl font-bold mt-1 text-white"></p>
                    </div>
                    <!-- Raindrop Icon SVG (Water Blue) -->
                    <div class="p-2.5 rounded-xl bg-blue-500/20 text-sky-400 border border-blue-400/30 shadow-inner">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                            xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 2.69l5.66 5.66a8 8 0 11-11.31 0z"></path>
                        </svg>
                    </div>
                </div>
            </div>
        </section>

        <!-- 4. Previous 24 Hours Section -->
        <section id="previous-hours"
            class="card bg-emerald-950/65 backdrop-blur-xl border border-emerald-500/25 text-white shadow-2xl shadow-black/60 rounded-3xl p-6 sm:p-8 transition-all duration-300 hover:border-emerald-400/35">
            <h2 class="text-lg sm:text-xl font-bold tracking-tight mb-4 text-emerald-50">Previous 24 Hours</h2>
            <div class="overflow-x-auto flex gap-4 py-2 min-h-[80px] items-center">
            </div>
        </section>

        <!-- 5. Future 24 Hours Section -->
        <section id="future-hours"
            class="card bg-emerald-950/65 backdrop-blur-xl border border-emerald-500/25 text-white shadow-2xl shadow-black/60 rounded-3xl p-6 sm:p-8 transition-all duration-300 hover:border-emerald-400/35">
            <h2 class="text-lg sm:text-xl font-bold tracking-tight mb-4 text-emerald-50">Next 24 Hours</h2>
            <div class="overflow-x-auto flex gap-4 py-2 min-h-[80px] items-center">

            </div>
        </section>

        <!-- 6. Refresh Button  -->
        <div class="flex justify-center pt-2 pb-6">
            <button type="button" id="refresh-btn"
                class="group btn sm:btn-wide bg-blue-500 hover:bg-blue-700 text-white border-none rounded-xl shadow-lg shadow-blue-600/30 font-bold gap-2 transition-all duration-400 cursor-pointer">
                Refresh
            </button>
        </div>

    </div>

</body>

</html>
